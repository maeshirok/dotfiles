# macOS 向けの設定

# 新しいウィンドウ・ペインで fish を起動する
# (tmux-sensible は、これが空だと $SHELL(zsh)を使う設定を入れてしまうため、明示しておく)
set -g default-command "exec /opt/homebrew/bin/fish -l"

# undercurl(波線の下線)と下線の色に対応する(nvim の診断表示などで使用)
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'
